  <!-- Default Urd icon; the site icon from site.json overrides it on load -->

  <link rel="stylesheet" href="/assets/styles/base.css?v=436c87f4">
  <!-- The site's materialized theme (light-dark()): render-blocking and loaded
       AFTER base.css so it wins. Written at publish time (buildThemeCss).
       When missing (fresh clone before the first publish) base.css's
       @supports default theme remains; nothing breaks, just default colours. -->
  <link rel="stylesheet" href="/content/theme.css">
  <!--
    The engine is served as raw ES modules. Without preloading the browser
    discovers the imports layer by layer (a serial waterfall). These
    modulepreload links are the full STATIC import closure of boot.js, so
    the whole graph is fetched in one parallel wave. The editor layer
    (preview-edit.js and friends) loads dynamically and must NOT be listed
    here. tests/modulepreload.test.mjs keeps the list in sync with the
    source (the build fails on drift).
  -->
  <link rel="modulepreload" href="/assets/engine/0.7.4/boot.js">

       choice must not flash). External classic script due to CSP (script-src 'self', no inline). -->
  <script src="/assets/engine/0.7.4/theme-init.js"></script>
  <!-- The engine, render-blocking: its page transition listener is then in
       place before the arriving document's first rendering opportunity, so a
       page switch can hold the old page until the new one is rendered (the
       arrival hold in urd.js). Browsers without the attribute paint as they go. -->
  <script type="module" src="/assets/engine/0.7.4/boot.js" blocking="render"></script>
